<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scrapto Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        /* LOGIN SCREEN */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 40px);
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-logo {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .login-title {
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .login-subtitle {
            color: #718096;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .login-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 1rem;
            font-family: monospace;
        }
        .login-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }
        .login-btn:active {
            transform: scale(0.98);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-error {
            display: none;
            color: #e53e3e;
            text-align: center;
            margin-top: 1rem;
            padding: 0.75rem;
            background: #fff5f5;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .login-error.show { display: block; }

        /* ADMIN SCREEN */
        .admin-screen {
            display: none;
            max-width: 900px;
            margin: 0 auto;
        }
        .admin-screen.show { display: block; }
        
        .admin-header {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .admin-header h1 {
            font-size: 1.8rem;
            color: #1a202c;
            margin-bottom: 0.5rem;
        }
        .admin-header .repo {
            color: #718096;
            font-size: 0.9rem;
        }
        .logout-btn {
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: #e2e8f0;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .tab {
            padding: 0.75rem 1.5rem;
            background: rgba(255,255,255,0.3);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            touch-action: manipulation;
        }
        .tab.active {
            background: white;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }
        .tab-content.show { display: block; }

        .card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .add-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .add-btn:active { transform: scale(0.98); }

        .item-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .item-title {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .delete-btn {
            padding: 0.5rem 1rem;
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.9rem;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .save-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 1rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #48bb78;
            color: white;
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: none;
            z-index: 1000;
        }
        .toast.show { display: block; }

        .empty {
            text-align: center;
            padding: 3rem 1rem;
            color: #718096;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .login-card { padding: 2rem 1.5rem; }
            .admin-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-logo">🎁</div>
            <h1 class="login-title">Scrapto</h1>
            <p class="login-subtitle">Admin Panel</p>
            <input type="password" class="login-input" id="tokenInput" placeholder="Paste your GitHub token (ghp_...)">
            <button class="login-btn" id="loginBtn">🔐 Login</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- ADMIN SCREEN -->
    <div class="admin-screen" id="adminScreen">
        <div class="admin-header">
            <h1>🛠️ Admin Panel</h1>
            <p class="repo" id="repoName">WELPCASED/scrapsite</p>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="items">📦 Items</button>
            <button class="tab" data-tab="devices">📱 Devices</button>
            <button class="tab" data-tab="settings">⚙️ Settings</button>
        </div>

        <!-- ITEMS TAB -->
        <div class="tab-content show" id="itemsTab">
            <button class="add-btn" id="addItemBtn">➕ Add New Item</button>
            <div id="itemsList"></div>
        </div>

        <!-- DEVICES TAB -->
        <div class="tab-content" id="devicesTab">
            <button class="add-btn" id="addDeviceBtn">➕ Add Device</button>
            <div id="devicesList"></div>
        </div>

        <!-- SETTINGS TAB -->
        <div class="tab-content" id="settingsTab">
            <div class="card">
                <div class="form-group">
                    <label class="form-label">Device Question</label>
                    <input type="text" class="form-input" id="deviceQuestion">
                </div>
                <div class="form-group">
                    <label class="form-label">Offer Description</label>
                    <input type="text" class="form-input" id="offerDescription">
                </div>
                <div class="form-group">
                    <label class="form-label">Offer Button Text</label>
                    <input type="text" class="form-input" id="offerButtonText">
                </div>
                <div class="form-group">
                    <label class="form-label">Timer Duration (seconds)</label>
                    <input type="number" class="form-input" id="timerDuration">
                </div>
                <div class="form-group">
                    <label class="form-label">Unlock Title</label>
                    <input type="text" class="form-input" id="unlockTitle">
                </div>
                <div class="form-group">
                    <label class="form-label">Reward Label</label>
                    <input type="text" class="form-input" id="rewardLabel">
                </div>
                <div class="form-group">
                    <label class="form-label">Reward Button Name</label>
                    <input type="text" class="form-input" id="rewardButtonName">
                </div>
                <div class="form-group">
                    <label class="form-label">Reward Button Link</label>
                    <input type="text" class="form-input" id="rewardButtonLink">
                </div>
            </div>
        </div>

        <button class="save-btn" id="saveBtn">💾 Save All Changes</button>
    </div>

    <div class="toast" id="toast">Changes saved!</div>

    <script>
        const REPO = 'WELPCASED/scrapsite';
        const BRANCH = 'main';
        let TOKEN = '';
        let items = [];
        let devices = [];
        let settings = {};

        // ══════════════════════════════════════════════════════════════
        // INIT
        // ══════════════════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            // Login button
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.addEventListener('click', handleLogin);
            
            // Enter key on token input
            document.getElementById('tokenInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', () => {
                sessionStorage.removeItem('github_token');
                location.reload();
            });

            // Tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('show'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.tab + 'Tab').classList.add('show');
                });
            });

            // Add buttons
            document.getElementById('addItemBtn').addEventListener('click', () => {
                items.push({ id: 'item_' + Date.now(), title: 'New Item', description: '', photo: '', reward: '', views: 0 });
                renderItems();
                showToast('Item added!');
            });

            document.getElementById('addDeviceBtn').addEventListener('click', () => {
                devices.push({ id: 'device_' + Date.now(), name: 'New Device', link: 'https://example.com' });
                renderDevices();
                showToast('Device added!');
            });

            // Save button
            document.getElementById('saveBtn').addEventListener('click', saveAll);

            // Auto-login if token exists
            const savedToken = sessionStorage.getItem('github_token');
            if (savedToken) {
                document.getElementById('tokenInput').value = savedToken;
                handleLogin();
            }
        });

        // ══════════════════════════════════════════════════════════════
        // LOGIN
        // ══════════════════════════════════════════════════════════════
        async function handleLogin() {
            const btn = document.getElementById('loginBtn');
            const input = document.getElementById('tokenInput');
            const error = document.getElementById('loginError');
            
            const token = input.value.trim();
            
            if (!token) {
                error.textContent = 'Please enter a token';
                error.classList.add('show');
                return;
            }

            btn.textContent = '⏳ Logging in...';
            btn.disabled = true;
            error.classList.remove('show');

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (!res.ok) {
                    throw new Error('Invalid token or no repo access');
                }

                TOKEN = token;
                sessionStorage.setItem('github_token', token);

                // Load data
                await loadData();

                // Show admin screen
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminScreen').classList.add('show');

                renderItems();
                renderDevices();
                renderSettings();

            } catch (err) {
                error.textContent = err.message;
                error.classList.add('show');
                btn.textContent = '🔐 Login';
                btn.disabled = false;
            }
        }

        // ══════════════════════════════════════════════════════════════
        // GITHUB API
        // ══════════════════════════════════════════════════════════════
        async function getFile(path) {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
                headers: { 'Authorization': `token ${TOKEN}` }
            });
            if (!res.ok) return null;
            return await res.json();
        }

        async function saveFile(path, content, message) {
            const existing = await getFile(path);
            const body = {
                message,
                content: btoa(unescape(encodeURIComponent(content))),
                branch: BRANCH
            };
            if (existing) body.sha = existing.sha;

            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return res.ok;
        }

        async function deleteFile(path, message) {
            const existing = await getFile(path);
            if (!existing) return true;

            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: 'DELETE',
                headers: { 'Authorization': `token ${TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, sha: existing.sha, branch: BRANCH })
            });
            return res.ok;
        }

        // ══════════════════════════════════════════════════════════════
        // DATA
        // ══════════════════════════════════════════════════════════════
        function parseMarkdown(content) {
            const match = content.match(/^---\n([\s\S]*?)\n---/);
            if (!match) return {};
            const data = {};
            match[1].split('\n').forEach(line => {
                const i = line.indexOf(':');
                if (i > -1) {
                    const key = line.substring(0, i).trim();
                    let val = line.substring(i + 1).trim().replace(/^["']|["']$/g, '');
                    if (!isNaN(val) && val !== '') val = Number(val);
                    data[key] = val;
                }
            });
            return data;
        }

        function toMarkdown(obj) {
            let md = '---\n';
            for (let key in obj) {
                if (key === 'id' || key === '_filename') continue;
                let val = obj[key];
                if (typeof val === 'string') val = `"${val}"`;
                md += `${key}: ${val}\n`;
            }
            md += '---\n';
            return md;
        }

        async function loadData() {
            // Load items
            try {
                const itemsRes = await fetch(`https://api.github.com/repos/${REPO}/contents/_items?ref=${BRANCH}`, {
                    headers: { 'Authorization': `token ${TOKEN}` }
                });
                if (itemsRes.ok) {
                    const files = await itemsRes.json();
                    items = [];
                    for (const file of files) {
                        if (file.name.endsWith('.md')) {
                            const r = await fetch(file.download_url);
                            const content = await r.text();
                            const data = parseMarkdown(content);
                            data.id = file.name.replace('.md', '');
                            data._filename = file.name;
                            items.push(data);
                        }
                    }
                }
            } catch (e) { console.error('Load items:', e); }

            // Load devices
            try {
                const devicesRes = await fetch(`https://api.github.com/repos/${REPO}/contents/_devices?ref=${BRANCH}`, {
                    headers: { 'Authorization': `token ${TOKEN}` }
                });
                if (devicesRes.ok) {
                    const files = await devicesRes.json();
                    devices = [];
                    for (const file of files) {
                        if (file.name.endsWith('.md')) {
                            const r = await fetch(file.download_url);
                            const content = await r.text();
                            const data = parseMarkdown(content);
                            data.id = file.name.replace('.md', '');
                            data._filename = file.name;
                            devices.push(data);
                        }
                    }
                }
            } catch (e) { console.error('Load devices:', e); }

            // Load settings
            try {
                const settingsFile = await getFile('_data/settings.json');
                if (settingsFile) {
                    const content = atob(settingsFile.content.replace(/\n/g, ''));
                    settings = JSON.parse(content);
                } else {
                    settings = {
                        deviceQuestion: 'What device are you using?',
                        offerDescription: 'Complete this offer to unlock your item',
                        offerButtonText: 'Complete Offer',
                        timerDuration: 40,
                        unlockTitle: 'Content unlocked!',
                        rewardLabel: 'Your Reward',
                        rewardButtonName: 'Get Your Reward',
                        rewardButtonLink: 'https://example.com/reward'
                    };
                }
            } catch (e) { console.error('Load settings:', e); }
        }

        async function saveAll() {
            const btn = document.getElementById('saveBtn');
            btn.textContent = '💾 Saving...';
            btn.disabled = true;

            try {
                // Save items
                for (const item of items) {
                    const filename = item._filename || `${item.id}.md`;
                    item._filename = filename;
                    await saveFile(`_items/${filename}`, toMarkdown(item), `Update: ${item.title}`);
                }

                // Save devices
                for (const device of devices) {
                    const filename = device._filename || `${device.id}.md`;
                    device._filename = filename;
                    await saveFile(`_devices/${filename}`, toMarkdown(device), `Update: ${device.name}`);
                }

                // Save settings
                settings.deviceQuestion = document.getElementById('deviceQuestion').value;
                settings.offerDescription = document.getElementById('offerDescription').value;
                settings.offerButtonText = document.getElementById('offerButtonText').value;
                settings.timerDuration = parseInt(document.getElementById('timerDuration').value);
                settings.unlockTitle = document.getElementById('unlockTitle').value;
                settings.rewardLabel = document.getElementById('rewardLabel').value;
                settings.rewardButtonName = document.getElementById('rewardButtonName').value;
                settings.rewardButtonLink = document.getElementById('rewardButtonLink').value;

                await saveFile('_data/settings.json', JSON.stringify(settings, null, 2), 'Update settings');

                showToast('✅ All changes saved!');
            } catch (e) {
                alert('Error saving: ' + e.message);
            }

            btn.textContent = '💾 Save All Changes';
            btn.disabled = false;
        }

        // ══════════════════════════════════════════════════════════════
        // RENDER
        // ══════════════════════════════════════════════════════════════
        function renderItems() {
            const container = document.getElementById('itemsList');
            if (items.length === 0) {
                container.innerHTML = '<div class="empty">No items yet. Click "Add New Item" to create one!</div>';
                return;
            }

            container.innerHTML = items.map((item, i) => `
                <div class="item-card">
                    <div class="item-header">
                        <div class="item-title">Item ${i + 1}</div>
                        <button class="delete-btn" onclick="deleteItem(${i})">Delete</button>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-input" value="${escapeHtml(item.title || '')}" onchange="items[${i}].title = this.value">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <input type="text" class="form-input" value="${escapeHtml(item.description || '')}" onchange="items[${i}].description = this.value">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Reward Message</label>
                        <input type="text" class="form-input" value="${escapeHtml(item.reward || '')}" onchange="items[${i}].reward = this.value">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Photo URL</label>
                        <input type="text" class="form-input" value="${escapeHtml(item.photo || '')}" onchange="items[${i}].photo = this.value" placeholder="https://...">
                    </div>
                </div>
            `).join('');
        }

        function renderDevices() {
            const container = document.getElementById('devicesList');
            if (devices.length === 0) {
                container.innerHTML = '<div class="empty">No devices yet. Click "Add Device" to create one!</div>';
                return;
            }

            container.innerHTML = devices.map((device, i) => `
                <div class="item-card">
                    <div class="item-header">
                        <div class="item-title">Device ${i + 1}</div>
                        <button class="delete-btn" onclick="deleteDevice(${i})">Delete</button>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Device Name</label>
                        <input type="text" class="form-input" value="${escapeHtml(device.name || '')}" onchange="devices[${i}].name = this.value">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Offer Link</label>
                        <input type="text" class="form-input" value="${escapeHtml(device.link || '')}" onchange="devices[${i}].link = this.value" placeholder="https://...">
                    </div>
                </div>
            `).join('');
        }

        function renderSettings() {
            document.getElementById('deviceQuestion').value = settings.deviceQuestion || '';
            document.getElementById('offerDescription').value = settings.offerDescription || '';
            document.getElementById('offerButtonText').value = settings.offerButtonText || '';
            document.getElementById('timerDuration').value = settings.timerDuration || 40;
            document.getElementById('unlockTitle').value = settings.unlockTitle || '';
            document.getElementById('rewardLabel').value = settings.rewardLabel || '';
            document.getElementById('rewardButtonName').value = settings.rewardButtonName || '';
            document.getElementById('rewardButtonLink').value = settings.rewardButtonLink || '';
        }

        // ══════════════════════════════════════════════════════════════
        // ACTIONS
        // ══════════════════════════════════════════════════════════════
        async function deleteItem(index) {
            if (!confirm('Delete this item?')) return;
            const item = items[index];
            if (item._filename) {
                await deleteFile(`_items/${item._filename}`, `Delete: ${item.title}`);
            }
            items.splice(index, 1);
            renderItems();
            showToast('Item deleted!');
        }

        async function deleteDevice(index) {
            if (!confirm('Delete this device?')) return;
            const device = devices[index];
            if (device._filename) {
                await deleteFile(`_devices/${device._filename}`, `Delete: ${device.name}`);
            }
            devices.splice(index, 1);
            renderDevices();
            showToast('Device deleted!');
        }

        // ══════════════════════════════════════════════════════════════
        // HELPERS
        // ══════════════════════════════════════════════════════════════
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
