<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapto</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #7C5CFF;
            --p2: #9B7EFF;
            --acc: #FF6B6B;
            --ok: #00C896;
            --bg: #0B0B18;
            --s1: #13132A;
            --s2: #1A1A35;
            --border: rgba(255,255,255,0.07);
            --text: #EEEEFF;
            --muted: #6B6B99;
            --r: 14px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px 20px 60px;
        }
        body::before {
            content:'';
            position:fixed;
            top:-150px; left:50%;
            transform:translateX(-50%);
            width:600px; height:400px;
            background: radial-gradient(ellipse, rgba(124,92,255,0.15) 0%, transparent 70%);
            pointer-events:none; z-index:0;
        }
        .wrap { max-width:820px; margin:0 auto; position:relative; z-index:1; }

        /* HEADER */
        .header { text-align:center; padding:3rem 0 2.5rem; }
        .logo {
            font-family:'Syne',sans-serif;
            font-size:3rem; font-weight:900;
            background:linear-gradient(135deg,#B39DFF 0%,#7C5CFF 45%,#FF6B6B 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            letter-spacing:-1px;
        }
        .tagline { color:var(--muted); margin-top:.5rem; font-size:.95rem; }

        /* SEARCH */
        .search-wrap { position:relative; margin-bottom:1.5rem; }
        .search-icon { position:absolute; left:1.1rem; top:50%; transform:translateY(-50%); opacity:.4; font-size:1rem; }
        .search-bar {
            width:100%; padding:.95rem 1rem .95rem 3rem;
            background:var(--s1); border:1.5px solid var(--border);
            border-radius:var(--r); color:var(--text);
            font-family:'DM Sans',sans-serif; font-size:.98rem;
            transition:border-color .2s, box-shadow .2s;
        }
        .search-bar::placeholder { color:var(--muted); }
        .search-bar:focus { outline:none; border-color:var(--p); box-shadow:0 0 0 4px rgba(124,92,255,.12); }

        /* CARDS */
        .items-list { display:flex; flex-direction:column; gap:.8rem; }
        .item-card {
            display:flex; align-items:center; gap:1.3rem;
            padding:1.2rem 1.4rem;
            background:var(--s1); border:1.5px solid var(--border);
            border-radius:var(--r); cursor:pointer;
            transition:all .22s ease;
            animation:fadeUp .4s ease both;
        }
        .item-card:hover {
            border-color:rgba(124,92,255,.45);
            background:var(--s2);
            transform:translateY(-2px);
            box-shadow:0 8px 28px rgba(124,92,255,.14);
        }
        @keyframes fadeUp {
            from{opacity:0;transform:translateY(14px);}
            to{opacity:1;transform:translateY(0);}
        }
        .item-thumb {
            width:68px; height:68px; border-radius:12px; flex-shrink:0;
            background:linear-gradient(135deg,var(--p) 0%,#B39DFF 100%);
            display:flex; align-items:center; justify-content:center;
            font-size:1.9rem; overflow:hidden;
        }
        .item-thumb img { width:100%; height:100%; object-fit:cover; }
        .item-info { flex:1; min-width:0; }
        .item-title {
            font-family:'Syne',sans-serif; font-weight:700;
            font-size:1.1rem; color:var(--text);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            margin-bottom:.2rem;
        }
        .item-desc { color:var(--muted); font-size:.88rem; }
        .item-arrow { color:var(--p); font-size:1.2rem; flex-shrink:0; opacity:.6; transition:all .2s; }
        .item-card:hover .item-arrow { opacity:1; transform:translateX(3px); }

        /* SKELETON */
        .skeleton { display:flex; flex-direction:column; gap:.8rem; }
        .skel-card {
            height:92px; background:var(--s1);
            border:1.5px solid var(--border); border-radius:var(--r);
            position:relative; overflow:hidden;
        }
        .skel-card::after {
            content:''; position:absolute; inset:0;
            background:linear-gradient(90deg,transparent 30%,rgba(255,255,255,0.04) 50%,transparent 70%);
            animation:shimmer 1.5s infinite;
        }
        @keyframes shimmer { from{transform:translateX(-100%);} to{transform:translateX(100%);} }

        .empty { text-align:center; padding:4rem 2rem; color:var(--muted); }
        .empty-icon { font-size:3rem; display:block; margin-bottom:1rem; }

        /* SCREEN TRANSITIONS */
        .screen { display:none; }
        .screen.on { display:block; animation:fadeUp .3s ease both; }

        /* BACK BTN */
        .back-btn {
            display:inline-flex; align-items:center; gap:.5rem;
            background:transparent; color:var(--p);
            border:1.5px solid rgba(124,92,255,.3);
            padding:.6rem 1.2rem; border-radius:10px;
            cursor:pointer; font-family:'DM Sans',sans-serif;
            font-size:.92rem; font-weight:600; margin-bottom:2rem;
            transition:all .2s;
        }
        .back-btn:hover { background:rgba(124,92,255,.1); border-color:var(--p); }

        .screen-title {
            font-family:'Syne',sans-serif; font-size:1.45rem;
            font-weight:800; text-align:center; margin-bottom:2rem;
        }

        /* DEVICE SCREEN */
        .device-grid {
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
            gap:.9rem;
        }
        .device-btn {
            padding:1.4rem 1rem;
            background:var(--s1); border:1.5px solid var(--border);
            border-radius:var(--r); color:var(--text);
            font-family:'DM Sans',sans-serif; font-size:1rem; font-weight:600;
            cursor:pointer; transition:all .2s; text-align:center;
        }
        .device-btn:hover {
            border-color:var(--p); background:var(--s2);
            box-shadow:0 4px 20px rgba(124,92,255,.18);
            transform:translateY(-2px);
        }

        /* OFFER SCREEN */
        .offer-screen { text-align:center; }
        .offer-icon { font-size:4.5rem; margin-bottom:1.5rem; animation:float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
        .offer-title {
            font-family:'Syne',sans-serif; font-size:2rem;
            font-weight:800; margin-bottom:.8rem;
        }
        .offer-desc { color:var(--muted); font-size:1rem; margin-bottom:2.5rem; line-height:1.6; }
        .offer-btn {
            display:inline-block; padding:1.1rem 3rem;
            background:linear-gradient(135deg,var(--p) 0%,#5A3DD8 100%);
            color:white; border:none; border-radius:var(--r);
            font-family:'DM Sans',sans-serif; font-size:1.1rem; font-weight:700;
            cursor:pointer; box-shadow:0 6px 24px rgba(124,92,255,.4);
            transition:all .2s; margin-bottom:2rem;
        }
        .offer-btn:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(124,92,255,.5); }
        .offer-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }

        /* LOADER */
        .loader { display:none; margin:1.5rem auto; text-align:center; }
        .loader.on { display:block; }
        .loader-ring {
            width:52px; height:52px; margin:0 auto;
            border:4px solid rgba(124,92,255,.2);
            border-top:4px solid var(--p);
            border-radius:50%;
            animation:spin 1s linear infinite;
        }
        @keyframes spin { to{transform:rotate(360deg);} }
        .loader-text { color:var(--muted); margin-top:.8rem; font-size:.9rem; }

        /* REWARD */
        .reward-box {
            display:none; animation:scaleIn .5s ease both;
            background:var(--s1); border:1.5px solid rgba(0,200,150,.25);
            border-radius:20px; padding:2.5rem 2rem; margin-top:1rem;
        }
        .reward-box.on { display:block; }
        @keyframes scaleIn { from{opacity:0;transform:scale(.9);} to{opacity:1;transform:scale(1);} }
        .reward-emoji { font-size:3.5rem; margin-bottom:1rem; }
        .reward-title {
            font-family:'Syne',sans-serif; font-size:1.6rem;
            font-weight:800; color:var(--ok); margin-bottom:.5rem;
        }
        .reward-label { color:var(--muted); margin-bottom:1.5rem; font-size:.95rem; }
        .reward-link {
            display:inline-block;
            padding:1rem 2.5rem;
            background:linear-gradient(135deg,var(--ok) 0%,#00A878 100%);
            color:white; border-radius:12px; text-decoration:none;
            font-weight:700; font-size:1.05rem;
            box-shadow:0 6px 20px rgba(0,200,150,.3);
            transition:all .2s;
        }
        .reward-link:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,200,150,.4); }

        @media(max-width:480px){
            .logo { font-size:2.3rem; }
            .item-thumb { width:56px; height:56px; }
            .offer-title { font-size:1.6rem; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <div class="logo">🎁 Scrapto</div>
        <p class="tagline">All scrapto here...</p>
    </div>

    <!-- BROWSE SCREEN -->
    <div class="screen on" id="browseScreen">
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-bar" id="searchBar" placeholder="Search for items...">
        </div>
        <div class="items-list" id="itemsList">
            <div class="skeleton">
                <div class="skel-card"></div>
                <div class="skel-card"></div>
                <div class="skel-card"></div>
            </div>
        </div>
    </div>

    <!-- DEVICE SCREEN -->
    <div class="screen" id="deviceScreen">
        <button class="back-btn" id="backToItems">← Back</button>
        <div class="screen-title" id="deviceQuestion">What device are you using?</div>
        <div class="device-grid" id="deviceGrid"></div>
    </div>

    <!-- OFFER SCREEN -->
    <div class="screen offer-screen" id="offerScreen">
        <button class="back-btn" id="backToDevices">← Back</button>
        <div class="offer-icon">🎯</div>
        <h2 class="offer-title">Almost there!</h2>
        <p class="offer-desc" id="offerDesc">Complete this offer to unlock your item</p>
        <button class="offer-btn" id="offerBtn">Complete Offer</button>
        <div class="loader" id="loader">
            <div class="loader-ring"></div>
            <p class="loader-text">Verifying your offer...</p>
        </div>
        <div class="reward-box" id="rewardBox">
            <div class="reward-emoji">🎉</div>
            <div class="reward-title" id="unlockTitle">Content unlocked!</div>
            <p class="reward-label" id="rewardLabel">Your Reward</p>
            <a href="#" id="rewardLink" class="reward-link" target="_blank">Get Your Reward</a>
        </div>
    </div>
</div>

<script>
    let items = [], devices = [], settings = {};
    let selectedItem = null, selectedDevice = null, timerRunning = false;

    // ── LOAD DATA ──────────────────────────────────────────────────────
    async function loadData() {
        try {
            const [iRes, dRes, sRes] = await Promise.all([
                fetch('/_build/items.json'),
                fetch('/_build/devices.json'),
                fetch('/_build/settings.json')
            ]);
            items    = await iRes.json();
            devices  = await dRes.json();
            settings = await sRes.json();
        } catch(e) {
            // Fallback demo data so it never breaks
            items    = [];
            devices  = [{ name: 'Android', link: '#' }, { name: 'iOS', link: '#' }];
            settings = {
                deviceQuestion: 'What device are you using?',
                offerDescription: 'Complete this offer to unlock your item',
                offerButtonText: 'Complete Offer',
                timerDuration: 40,
                unlockTitle: 'Content unlocked!',
                rewardLabel: 'Your Reward',
                rewardButtonName: 'Get Your Reward',
                rewardButtonLink: 'https://example.com'
            };
        }
        applySettings();
        renderItems(items);
        renderDevices();
    }

    function applySettings() {
        document.getElementById('deviceQuestion').textContent = settings.deviceQuestion || 'What device are you using?';
        document.getElementById('offerDesc').textContent      = settings.offerDescription || 'Complete this offer to unlock your item';
        document.getElementById('offerBtn').textContent       = settings.offerButtonText || 'Complete Offer';
        document.getElementById('unlockTitle').textContent    = settings.unlockTitle || 'Content unlocked!';
        document.getElementById('rewardLabel').textContent    = settings.rewardLabel || 'Your Reward';
    }

    // ── RENDER ITEMS ───────────────────────────────────────────────────
    function renderItems(list) {
        const el = document.getElementById('itemsList');
        if (!list.length) {
            el.innerHTML = `<div class="empty"><span class="empty-icon">🔍</span>No items found</div>`;
            return;
        }
        el.innerHTML = list.map((item, i) => `
            <div class="item-card" data-index="${i}" style="animation-delay:${i * 0.05}s">
                <div class="item-thumb">
                    ${item.photo ? `<img src="${item.photo}" alt="${item.title}">` : '📦'}
                </div>
                <div class="item-info">
                    <div class="item-title">${item.title || 'Untitled'}</div>
                    <div class="item-desc">${item.description || ''}</div>
                </div>
                <div class="item-arrow">→</div>
            </div>
        `).join('');

        el.querySelectorAll('.item-card').forEach(card => {
            card.addEventListener('click', () => {
                const idx = parseInt(card.dataset.index);
                selectedItem = items[idx];
                showScreen('deviceScreen');
            });
        });
    }

    function renderDevices() {
        const grid = document.getElementById('deviceGrid');
        grid.innerHTML = devices.map((d, i) => `
            <button class="device-btn" data-index="${i}">${d.name}</button>
        `).join('');
        grid.querySelectorAll('.device-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedDevice = devices[parseInt(btn.dataset.index)];
                showScreen('offerScreen');
            });
        });
    }

    // ── SCREEN MANAGEMENT ──────────────────────────────────────────────
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
        document.getElementById(id).classList.add('on');
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Reset offer screen state
        if (id === 'offerScreen') {
            document.getElementById('offerBtn').disabled = false;
            document.getElementById('loader').classList.remove('on');
            document.getElementById('rewardBox').classList.remove('on');
            timerRunning = false;
        }
    }

    // ── OFFER CLICK ────────────────────────────────────────────────────
    document.getElementById('offerBtn').addEventListener('click', () => {
        if (timerRunning || !selectedDevice || !selectedItem) return;
        window.open(selectedDevice.link, '_blank');

        timerRunning = true;
        document.getElementById('offerBtn').disabled = true;
        document.getElementById('loader').classList.add('on');

        const duration = (settings.timerDuration || 40) * 1000;
        setTimeout(() => {
            document.getElementById('loader').classList.remove('on');
            document.getElementById('rewardLink').textContent = settings.rewardButtonName || 'Get Your Reward';
            document.getElementById('rewardLink').href        = settings.rewardButtonLink || '#';
            document.getElementById('rewardBox').classList.add('on');
            timerRunning = false;
        }, duration);
    });

    // ── NAVIGATION ─────────────────────────────────────────────────────
    document.getElementById('backToItems').addEventListener('click',   () => showScreen('browseScreen'));
    document.getElementById('backToDevices').addEventListener('click', () => showScreen('deviceScreen'));

    // ── SEARCH ─────────────────────────────────────────────────────────
    document.getElementById('searchBar').addEventListener('input', function() {
        const q = this.value.toLowerCase();
        const filtered = items.filter(item =>
            (item.title || '').toLowerCase().includes(q) ||
            (item.description || '').toLowerCase().includes(q)
        );
        renderItems(filtered);
    });

    loadData();
</script>
</body>
</html>
